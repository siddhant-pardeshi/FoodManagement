<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Khaana Bachaao — Food Donation Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2c1a"/>
      <stop offset="0.45" stop-color="#7a4527"/>
      <stop offset="1" stop-color="#2a1608"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b27a"/>
      <stop offset="1" stop-color="#c97b3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb37a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb37a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d6b"/>
      <stop offset="1" stop-color="#e2622f"/>
    </linearGradient>
    <style>
      .steam {
        animation: steam 2.8s ease-in-out infinite;
      }
      @keyframes steam {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 0.75; }
        100% { transform: translateY(-26px); opacity: 0; }
      }
      .flow {
        stroke-dasharray: 300 1700;
        animation: sweep 5s linear infinite;
      }
      @keyframes sweep {
        from { stroke-dashoffset: 2000; }
        to { stroke-dashoffset: 0; }
      }
      .fall {
        animation: fall 6.5s linear infinite;
      }
      @keyframes fall {
        0% { transform: translateY(-50px); opacity: 0; }
        12% { opacity: 0.65; }
        85% { opacity: 0.65; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      .cell {
        animation: drift 9s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(26px, -20px) scale(1.15); }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- floating plates / produce -->
  <g fill="#f2b27a" opacity="0.14">
    <circle class="cell" cx="960" cy="60" r="24"/>
    <circle class="cell" cx="1080" cy="200" r="30" style="animation-delay:-3s"/>
    <circle class="cell" cx="880" cy="240" r="18" style="animation-delay:-5s"/>
    <circle class="cell" cx="70" cy="250" r="22" style="animation-delay:-2s"/>
    <circle class="cell" cx="320" cy="40" r="16" style="animation-delay:-6s"/>
  </g>
  <g fill="#ffffff" opacity="0.05">
    <circle class="cell" cx="1010" cy="120" r="40" style="animation-delay:-4s"/>
    <circle class="cell" cx="160" cy="120" r="34" style="animation-delay:-1s"/>
  </g>

  <!-- falling produce -->
  <g>
    <g class="fall" transform="translate(240,0)">
      <circle cx="0" cy="0" r="9" fill="url(#foodGrad)"/>
      <path d="M0,-9 q2,-6 8,-7 q-1,6 -8,7 Z" fill="#8bb653"/>
    </g>
    <g class="fall" transform="translate(430,0)" style="animation-delay:-2.5s">
      <circle cx="0" cy="0" r="7" fill="url(#foodGrad)"/>
      <path d="M0,-7 q2,-5 7,-6 q-1,5 -7,6 Z" fill="#8bb653"/>
    </g>
    <g class="fall" transform="translate(770,0)" style="animation-delay:-4s">
      <circle cx="0" cy="0" r="9" fill="url(#foodGrad)"/>
      <path d="M0,-9 q2,-6 8,-7 q-1,6 -8,7 Z" fill="#8bb653"/>
    </g>
    <g class="fall" transform="translate(1110,0)" style="animation-delay:-1.2s">
      <circle cx="0" cy="0" r="7" fill="url(#foodGrad)"/>
      <path d="M0,-7 q2,-5 7,-6 q-1,5 -7,6 Z" fill="#8bb653"/>
    </g>
    <g class="fall" transform="translate(950,0)" style="animation-delay:-5.2s">
      <circle cx="0" cy="0" r="7" fill="url(#foodGrad)"/>
      <path d="M0,-7 q2,-5 7,-6 q-1,5 -7,6 Z" fill="#8bb653"/>
    </g>
  </g>

  <!-- food-flow line: donor to receiver -->
  <path
    d="M0,160 Q75,120 150,160 T300,160 T450,160 T600,160 T750,160 T900,160 T1050,160 T1200,160"
    fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round"/>
  <path
    class="flow"
    d="M0,160 Q75,120 150,160 T300,160 T450,160 T600,160 T750,160 T900,160 T1050,160 T1200,160"
    fill="none" stroke="#ffc08a" stroke-width="3" stroke-linecap="round" style="filter: drop-shadow(0 0 6px rgba(255,192,138,0.9))"/>

  <!-- bowl emblem with rising steam -->
  <circle cx="185" cy="150" r="105" fill="url(#glow)"/>
  <g transform="translate(185,166)">
    <path d="M-52,0 A52,52 0 0 0 52,0 Z" fill="url(#bowlGrad)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <rect x="-60" y="-6" width="120" height="10" rx="5" fill="#e89a55" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <path class="steam" d="M-18,-16 C-12,-26 -24,-34 -18,-46" fill="none" stroke="#ffe6cf" stroke-width="3.5" stroke-linecap="round"/>
    <path class="steam" d="M0,-16 C6,-26 -6,-34 0,-46" fill="none" stroke="#ffe6cf" stroke-width="3.5" stroke-linecap="round" style="animation-delay:-0.9s"/>
    <path class="steam" d="M18,-16 C24,-26 12,-34 18,-46" fill="none" stroke="#ffe6cf" stroke-width="3.5" stroke-linecap="round" style="animation-delay:-1.8s"/>
  </g>

  <!-- title -->
  <text x="330" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Khaana Bachaao</text>
  <text x="334" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#ffd9b8">Food Donation Platform — moving surplus food to those who need it</text>
  <text x="334" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#ffffff" fill-opacity="0.72">React 19  •  Node.js Serverless API  •  MySQL  •  Vercel  •  Donors, NGOs &amp; shelters on one platform</text>
</svg>
